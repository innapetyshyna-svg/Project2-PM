<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kanban Studio</title>
  </head>
  <body style="font-family: sans-serif; color: #032147">
    <h1>Hello world</h1>
    <p>API status: <span id="status" style="color: #888888">loading...</span></p>
    <script>
      fetch("/api/health")
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("status").textContent = data.status;
        });
    </script>
  </body>
</html>
